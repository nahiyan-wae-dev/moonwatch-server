name: Moonvale monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification instead of checking the site"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moonvale-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Install FCM dependency
        run: python3 -m pip install --disable-pip-version-check google-auth

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 monitor_runner.py --test
          else
            python3 monitor_runner.py
          fi

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "moonwatch-bot"
            git config user.email "moonwatch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update monitor state"
            git pull --rebase
            git push
          fi
